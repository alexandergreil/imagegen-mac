[project]
name = "imagegen"
version = "0.1.0"
description = "Local image generation engine with REST API and MCP server"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.8",
    "diffusers @ git+https://github.com/huggingface/diffusers@8315c5d6dc867349bf72d54eca59c83edf3b0024",
    "transformers>=5.17",
    "accelerate>=1.10",
    "pillow>=11",
    "safetensors>=0.6",
    "huggingface-hub>=1.0",
    "httpx>=0.28",
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "mcp>=2.0",
    "torchvision>=0.23",
]

[tool.uv]
package = false
